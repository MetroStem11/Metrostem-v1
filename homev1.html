<!doctype html><!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twofold Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600;700;800;900&display=swap">

  <style>
    :root {
      --ink: #141310; --paper: #ffffff; --cream: #ece2c7; --sky1: #4f93d6; --sky2: #cbe4f4;
      --yellow: #f2e63c; --yg1: #f3ee83; --yg2: #cfe7c3; --mint1: #d8ecdf; --mint2: #cadfea;
      --black: #0c0c0c; --muted: #6c6a60; --line: #e3ddcb; --coral: #ec6440;
      --disp: 'Anton', Impact, 'Arial Narrow', sans-serif;
      --body: 'Figtree', system-ui, -apple-system, sans-serif;
      --maxw: 1180px; color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--paper); color: var(--ink); font-family: var(--body);
      font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, h4 { margin: 0; line-height: .98; }
    p { margin: 0; }
    .wrap {
      max-width: var(--maxw); margin: 0 auto;
      padding-left: max(20px, env(safe-area-inset-left, 0px));
      padding-right: max(20px, env(safe-area-inset-right, 0px));
    }
    .eyebrow { font-weight: 700; text-transform: uppercase; letter-spacing: .16em; font-size: 12px; color: var(--muted); }

    /* nav */
    header.nav {
      position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
      background: rgba(255,255,255,.82); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: #fff; }
    .nav-in { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-block: 11px; }
    .nav-links { display: flex; gap: 4px; flex-wrap: wrap; }
    .nav-links a {
      font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .1em;
      padding: 7px 11px; border-radius: 999px;
    }
    .nav-links a:hover { background: var(--cream); }
    .nav-brand { display: flex; align-items: center; gap: 8px; font-family: var(--disp); font-size: 19px; letter-spacing: .02em; }
    .nav-brand img { height: 30px; width: auto; }

    /* intro */
    .intro { text-align: center; padding-block: clamp(34px, 6vw, 64px) 6px; }

    /* Spring Logo Container & Animation */
    .spring-logo-container {
      width: 100%;
      max-width: 280px;
      margin: 0 auto clamp(16px, 3vw, 28px);
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 800px;
    }

    .spring-logo {
      width: clamp(140px, 18vw, 210px);
      height: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: 50% 95%; /* Compress and stretch relative to base */
      animation: springIdle 3.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      transition: filter 0.3s ease;
    }

    /* Idle breathing / gentle compression */
    @keyframes springIdle {
      0%, 100% {
        transform: translateY(0) scale(1, 1);
      }
      25% {
        transform: translateY(6px) scale(1.08, 0.88);
      }
      50% {
        transform: translateY(-12px) scale(0.94, 1.12);
      }
      75% {
        transform: translateY(3px) scale(1.03, 0.96);
      }
    }

    /* Spring Boing on hover or click */
    .spring-logo:hover,
    .spring-logo.spring-active {
      animation: springBoing 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      filter: drop-shadow(0 14px 22px rgba(79, 147, 214, 0.35));
    }

    @keyframes springBoing {
      0% {
        transform: translateY(0) scale(1, 1);
      }
      20% {
        /* Compression */
        transform: translateY(16px) scale(1.28, 0.65) rotate(-3deg);
      }
      45% {
        /* High stretch rebound */
        transform: translateY(-28px) scale(0.82, 1.34) rotate(3deg);
      }
      65% {
        /* Secondary bounce */
        transform: translateY(8px) scale(1.12, 0.9) rotate(-1.5deg);
      }
      82% {
        transform: translateY(-8px) scale(0.95, 1.08) rotate(0.8deg);
      }
      100% {
        transform: translateY(0) scale(1, 1) rotate(0deg);
      }
    }

    .intro p {
      max-width: 46ch; margin: 0 auto;
      font-size: clamp(16px, 2.4vw, 20px); font-weight: 500; line-height: 1.35;
    }
    .intro .soc { display: flex; gap: 18px; justify-content: center; margin-top: 18px; }
    .intro .soc a { font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .intro .soc a:hover { color: var(--ink); }

    /* wordmark */
    .wm {
      display: flex; align-items: flex-end; justify-content: center; width: 100%; max-width: 1120px;
      margin: clamp(12px, 2vw, 26px) auto 0;
    }
    .wm-letter { display: block; height: auto; transform-origin: 50% 100%; }
    .wm-hint { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 10px; letter-spacing: .04em; }
    @media (prefers-reduced-motion: no-preference) {
      .wm-letter { transition: transform .4s cubic-bezier(.34, 1.56, .5, 1); }
      .wm-letter:hover { transform: translateY(-15px) rotate(-3deg) scale(1.04); }
    }

    /* sky hero (torn paper) */
    .sky {
      position: relative; margin-top: -2px;
      background:
        radial-gradient(60% 40% at 20% 18%, rgba(255,255,255,.65), transparent 60%),
        radial-gradient(50% 36% at 78% 30%, rgba(255,255,255,.55), transparent 60%),
        radial-gradient(55% 40% at 60% 80%, rgba(255,255,255,.5), transparent 60%),
        linear-gradient(170deg, var(--sky1), var(--sky2) 72%, #eaf4fb);
    }
    .tear { position: absolute; left: 0; width: 100%; height: 34px; line-height: 0; z-index: 2; }
    .tear svg { width: 100%; height: 100%; display: block; }
    .tear.top { top: -1px; }
    .tear.bot { bottom: -1px; transform: scaleY(-1); }
    .sky-in {
      position: relative; z-index: 3; padding-block: clamp(56px, 9vw, 104px);
      display: grid; grid-template-columns: 1.05fr .95fr; gap: 36px; align-items: center;
    }
    .sky-head {
      font-family: var(--disp); color: var(--yellow); font-size: clamp(52px, 11vw, 132px);
      line-height:.92; text-shadow: 0 2px 0 rgba(20,30,60,.12); max-width: 12ch; cursor: default;
    }
    .sky-head .ch { display: inline-block; will-change: transform; }
    @media (prefers-reduced-motion: no-preference) {
      .sky-head:hover .ch { animation: slinky .6s ease both; animation-delay: calc(var(--i)*.045s); }
    }
    @keyframes slinky { 0%, 100% { transform: translateY(0); } 42% { transform: translateY(-.5em); } }
    .sky-media img { width: 100%; height: auto; border-radius: 18px; }
    .sky-note { margin-top: 12px; font-size: 11.5px; color: #2d5a86; opacity: .85; }
    @media(max-width: 760px) { .sky-in { grid-template-columns: 1fr; gap: 22px; } }

    /* showcases + reveals */
    .showcase { display: flex; justify-content: center; align-items: center; padding-block: clamp(48px, 8vw, 104px); }
    .showcase .draw { width: min(440px, 78vw); height: auto; filter: drop-shadow(0 20px 40px rgba(0,0,0,.14)); }
    .cream { background: var(--cream); }
    .ygreen { background: linear-gradient(180deg, var(--yg1), var(--yg2)); }
    .headvid { width: min(360px, 72vw); height: auto; mix-blend-mode: multiply; }
    @media (prefers-reduced-motion: no-preference) {
      .reveal.play .draw { animation: drawin 1.5s ease both; }
      .reveal.play .headvid { animation: popin 1.1s cubic-bezier(.2, 1.3, .4, 1) both; }
    }
    @keyframes drawin { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes popin { 0% { transform: scale(.82); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* featured case block */
    .mint { background: linear-gradient(140deg, var(--mint1), var(--mint2)); }
    .feat { padding-block: clamp(48px, 8vw, 96px); display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: stretch; }
    .feat-media { position: relative; border-radius: 20px; overflow: hidden; min-height: 340px; box-shadow: 0 18px 44px rgba(0,0,0,.18); }
    .feat-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .feat-media .who {
      position: absolute; top: 16px; left: 18px; z-index: 2; color: #fff; font-weight: 700; font-size: 12px;
      letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,0,0,.5);
    }
    .feat-media h2 {
      position: absolute; left: 18px; right: 18px; bottom: 18px; z-index: 2; font-family: var(--disp);
      color: var(--yellow); font-size: clamp(30px, 5vw, 52px); line-height: .9; text-shadow: 0 2px 10px rgba(0,0,0,.45);
    }
    .feat-card {
      background: #fff; border-radius: 20px; padding: clamp(22px, 3vw, 34px); display: flex; flex-direction: column;
      gap: 16px; box-shadow: 0 18px 44px rgba(0,0,0,.1);
    }
    .feat-card h3 { font-family: var(--disp); font-size: clamp(24px, 3.4vw, 34px); }
    .feat-card p { color: #3a382f; font-size: 15.5px; }
    .tiles { display: flex; gap: 14px; flex-wrap: wrap; margin-top: auto; }
    .tile { flex: 1 1 150px; min-width: 0; border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; }
    .tile .lbl {
      font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--muted);
      border: 1.5px solid var(--line); border-radius: 999px; display: inline-block; padding: 3px 10px; margin-bottom: 8px;
    }
    .tile .n { font-family: var(--disp); font-size: clamp(26px, 3.6vw, 38px); line-height: 1; font-variant-numeric: tabular-nums; }
    .tile .u { font-size: 12px; color: var(--muted); margin-top: 3px; }
    @media(max-width: 760px) { .feat { grid-template-columns: 1fr; } .feat-media { min-height: 280px; } }

    /* clients */
    .clients {
      background: radial-gradient(60% 50% at 30% 20%, rgba(255,255,255,.7), transparent 60%),
      linear-gradient(180deg, #eaf4fb, var(--sky2));
    }
    .clients-in { padding-block: clamp(40px, 7vw, 78px); text-align: center; }
    .clients .label { font-weight: 800; text-transform: uppercase; letter-spacing: .18em; font-size: 12px; color: #4c6a86; }
    .clients-row { display: flex; flex-wrap: wrap; gap: 12px 34px; justify-content: center; align-items: center; margin-top: 18px; }
    .clients-row span { font-family: var(--disp); font-size: clamp(20px, 3.4vw, 34px); color: #1d3a52; opacity: .9; }
    .clients .mom { margin-top: 18px; font-weight: 600; color: #355; }
    .clients .mom b { color: var(--sky1); }

    /* section header */
    .band { padding-block: clamp(52px, 8vw, 100px); }
    .band-head { max-width: 60ch; display: flex; flex-direction: column; gap: 12px; margin-bottom: 34px; }
    .band-head h2 { font-family: var(--disp); font-size: clamp(34px, 6vw, 64px); }
    .band-head p { color: var(--muted); }

    /* works films (black) */
    .films { background: var(--black); color: #f4f1e6; }
    .films .band-head h2 { color: #fff; }
    .films .band-head p { color: #b7b3a6; }
    .films-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 26px; }
    .films-top img { height: 70px; width: auto; }
    .films-top .url { font-weight: 700; font-size: 12px; letter-spacing: .1em; color: var(--yellow); text-transform: uppercase; }
    .film-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .film { display: flex; flex-direction: column; gap: 12px; }
    .film .thumb { border-radius: 14px; overflow: hidden; aspect-ratio: 3/4; background: #1a1a1a; }
    .film .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .film .cap { font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
    .film .cap small { display: block; color: #b7b3a6; font-weight: 600; letter-spacing: .04em; margin-top: 3px; }
    @media(max-width: 720px) { .film-grid { grid-template-columns: 1fr; } }
    .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 20px; }
    .cat { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 3/5; min-height: 260px; }
    .cat img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cat span {
      position: absolute; right: 14px; bottom: 16px; writing-mode: vertical-rl; transform: rotate(180deg);
      font-family: var(--disp); font-size: clamp(22px, 3vw, 34px); color: #f2e7c9; text-shadow: 0 1px 8px rgba(0,0,0,.5);
    }
    @media(max-width: 720px) { .cats { grid-template-columns: 1fr 1fr; } .cat:last-child { grid-column: span 2; aspect-ratio: 16/9; min-height: 180px; } }

    /* case studies */
    .cases { background: var(--cream); }
    .case {
      background: #fffdf6; border: 1px solid var(--line); border-radius: 22px; padding: clamp(22px, 3.3vw, 38px);
      margin-bottom: 24px; position: relative; overflow: hidden;
    }
    .case .blob { position: absolute; width: 74px; height: 74px; border-radius: 50%; opacity: .9; pointer-events: none; }
    .case .blob.b1 { left: -14px; top: 40px; background: radial-gradient(circle at 35% 30%, #fff, var(--sky1) 70%); }
    .case .blob.b2 { left: 14px; top: 150px; width: 54px; height: 54px; background: radial-gradient(circle at 35% 30%, #fff, var(--coral) 70%); }
    .case-head .who { font-size: 12.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .case-head h3 { font-family: var(--disp); font-size: clamp(28px, 4.6vw, 50px); margin-top: 6px; }
    .case-media { aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; margin: 22px 0; }
    .case-media img { width: 100%; height: 100%; object-fit: cover; }
    .case-over { max-width: 70ch; color: #3a382f; margin-bottom: 20px; }
    .nums { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
    .num { flex: 1 1 140px; min-width: 0; border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px; background: var(--cream); }
    .num .n { font-family: var(--disp); font-size: clamp(22px, 3.2vw, 30px); font-variant-numeric: tabular-nums; }
    .num .k { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 15px; }
    .tab {
      border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 8px 16px; font-weight: 700;
      font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
    .tpanel { max-width: 70ch; color: #2f2d25; }

    /* projects */
    .projects { background: #fff; }
    .proj-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
    .proj { background: var(--cream); border-radius: 18px; padding: 22px; grid-column: span 2; display: flex; flex-direction: column; gap: 9px; }
    .proj.lead { grid-column: span 3; background: var(--ink); color: #f5f1e6; }
    .proj .k { font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 11px; color: var(--sky1); }
    .proj.lead .k { color: var(--yellow); }
    .proj h4 { font-family: var(--disp); font-size: clamp(19px, 2.6vw, 25px); font-weight: 400; }
    .proj p { font-size: 14.5px; color: #4a473c; }
    .proj.lead p { color: #d9d4c6; }
    .proj .m { margin-top: auto; font-weight: 700; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .proj.lead .m { color: #b7b3a6; }
    @media(max-width: 880px) { .proj-grid { grid-template-columns: 1fr 1fr; } .proj, .proj.lead { grid-column: span 1; } }
    @media(max-width: 520px) { .proj-grid { grid-template-columns: 1fr; } }

    /* studio */
    .studio { background: var(--cream); }
    .studio-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; }
    .founder { border-top: 2px solid var(--ink); padding-top: 16px; margin-top: 18px; }
    .founder .role { font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--sky1); }
    .founder h4 { font-family: var(--disp); font-size: clamp(22px, 3vw, 30px); margin: 4px 0 8px; }
    .founder p { color: #3a382f; font-size: 15.5px; }
    .how { background: var(--ink); color: #f5f1e6; border-radius: 20px; padding: clamp(24px, 3.4vw, 36px); align-self: start; }
    .how h3 { font-family: var(--disp); color: var(--yellow); font-size: clamp(24px, 3.2vw, 32px); margin: 10px 0 12px; }
    .how p { color: #d9d4c6; font-size: 16px; }
    @media(max-width: 820px) { .studio-grid { grid-template-columns: 1fr; gap: 24px; } }

    /* contact */
    .contact { background: linear-gradient(170deg, var(--sky2), #eaf4fb); }
    .contact-in { padding-block: clamp(52px, 9vw, 104px); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .contact h2 { font-family: var(--disp); font-size: clamp(34px, 7vw, 74px); color: #1d3a52; max-width: 16ch; }
    .contact p { color: #355; max-width: 46ch; }
    .crow { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .pill { border: 2px solid var(--ink); border-radius: 999px; padding: 11px 18px; font-weight: 700; font-size: 15px; background: rgba(255,255,255,.5); }
    .copy { cursor: pointer; }
    .copy:hover { background: var(--yellow); }
    .copy .ok { display: none; color: #1d3a52; }
    .copy.copied .lbl { display: none; }
    .copy.copied .ok { display: inline; }

    footer { background: var(--ink); color: #cfcabb; padding-block: 30px; }
    .foot-in { display: flex; flex-wrap: wrap; gap: 12px 26px; justify-content: space-between; align-items: center; }
    .foot-in .b { font-family: var(--disp); color: #fff; font-size: 18px; }
    .foot-in a { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #cfcabb; }
    .foot-in a:hover { color: var(--yellow); }
    .foot-in .cr { width: 100%; font-size: 12px; color: #8f8b7e; }
    :focus-visible { outline: 3px solid var(--sky1); outline-offset: 2px; }
  </style>
</head>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twofold Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600;700;800;900&display=swap">

  <style>
    :root {
      --ink: #141310; --paper: #ffffff; --cream: #ece2c7; --sky1: #4f93d6; --sky2: #cbe4f4;
      --yellow: #f2e63c; --yg1: #f3ee83; --yg2: #cfe7c3; --mint1: #d8ecdf; --mint2: #cadfea;
      --black: #0c0c0c; --muted: #6c6a60; --line: #e3ddcb; --coral: #ec6440;
      --disp: 'Anton', Impact, 'Arial Narrow', sans-serif;
      --body: 'Figtree', system-ui, -apple-system, sans-serif;
      --maxw: 1180px; color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--paper); color: var(--ink); font-family: var(--body);
      font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, h4 { margin: 0; line-height: .98; }
    p { margin: 0; }
    .wrap {
      max-width: var(--maxw); margin: 0 auto;
      padding-left: max(20px, env(safe-area-inset-left, 0px));
      padding-right: max(20px, env(safe-area-inset-right, 0px));
    }
    .eyebrow { font-weight: 700; text-transform: uppercase; letter-spacing: .16em; font-size: 12px; color: var(--muted); }

    /* nav */
    header.nav {
      position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
      background: rgba(255,255,255,.82); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: #fff; }
    .nav-in { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-block: 11px; }
    .nav-links { display: flex; gap: 4px; flex-wrap: wrap; }
    .nav-links a {
      font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .1em;
      padding: 7px 11px; border-radius: 999px;
    }
    .nav-links a:hover { background: var(--cream); }
    .nav-brand { display: flex; align-items: center; gap: 8px; font-family: var(--disp); font-size: 19px; letter-spacing: .02em; }
    .nav-brand img { height: 30px; width: auto; }

    /* intro */
    .intro { text-align: center; padding-block: clamp(34px, 6vw, 64px) 6px; }

    /* Spring Logo Container & Animation */
    .spring-logo-container {
      width: 100%;
      max-width: 280px;
      margin: 0 auto clamp(16px, 3vw, 28px);
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 800px;
    }

    .spring-logo {
      width: clamp(140px, 18vw, 210px);
      height: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: 50% 95%; /* Compress and stretch relative to base */
      animation: springIdle 3.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      transition: filter 0.3s ease;
    }

    /* Idle breathing / gentle compression */
    @keyframes springIdle {
      0%, 100% {
        transform: translateY(0) scale(1, 1);
      }
      25% {
        transform: translateY(6px) scale(1.08, 0.88);
      }
      50% {
        transform: translateY(-12px) scale(0.94, 1.12);
      }
      75% {
        transform: translateY(3px) scale(1.03, 0.96);
      }
    }

    /* Spring Boing on hover or click */
    .spring-logo:hover,
    .spring-logo.spring-active {
      animation: springBoing 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      filter: drop-shadow(0 14px 22px rgba(79, 147, 214, 0.35));
    }

    @keyframes springBoing {
      0% {
        transform: translateY(0) scale(1, 1);
      }
      20% {
        /* Compression */
        transform: translateY(16px) scale(1.28, 0.65) rotate(-3deg);
      }
      45% {
        /* High stretch rebound */
        transform: translateY(-28px) scale(0.82, 1.34) rotate(3deg);
      }
      65% {
        /* Secondary bounce */
        transform: translateY(8px) scale(1.12, 0.9) rotate(-1.5deg);
      }
      82% {
        transform: translateY(-8px) scale(0.95, 1.08) rotate(0.8deg);
      }
      100% {
        transform: translateY(0) scale(1, 1) rotate(0deg);
      }
    }

    .intro p {
      max-width: 46ch; margin: 0 auto;
      font-size: clamp(16px, 2.4vw, 20px); font-weight: 500; line-height: 1.35;
    }
    .intro .soc { display: flex; gap: 18px; justify-content: center; margin-top: 18px; }
    .intro .soc a { font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .intro .soc a:hover { color: var(--ink); }

    /* wordmark */
    .wm {
      display: flex; align-items: flex-end; justify-content: center; width: 100%; max-width: 1120px;
      margin: clamp(12px, 2vw, 26px) auto 0;
    }
    .wm-letter { display: block; height: auto; transform-origin: 50% 100%; }
    .wm-hint { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 10px; letter-spacing: .04em; }
    @media (prefers-reduced-motion: no-preference) {
      .wm-letter { transition: transform .4s cubic-bezier(.34, 1.56, .5, 1); }
      .wm-letter:hover { transform: translateY(-15px) rotate(-3deg) scale(1.04); }
    }

    /* sky hero (torn paper) */
    .sky {
      position: relative; margin-top: -2px;
      background:
        radial-gradient(60% 40% at 20% 18%, rgba(255,255,255,.65), transparent 60%),
        radial-gradient(50% 36% at 78% 30%, rgba(255,255,255,.55), transparent 60%),
        radial-gradient(55% 40% at 60% 80%, rgba(255,255,255,.5), transparent 60%),
        linear-gradient(170deg, var(--sky1), var(--sky2) 72%, #eaf4fb);
    }
    .tear { position: absolute; left: 0; width: 100%; height: 34px; line-height: 0; z-index: 2; }
    .tear svg { width: 100%; height: 100%; display: block; }
    .tear.top { top: -1px; }
    .tear.bot { bottom: -1px; transform: scaleY(-1); }
    .sky-in {
      position: relative; z-index: 3; padding-block: clamp(56px, 9vw, 104px);
      display: grid; grid-template-columns: 1.05fr .95fr; gap: 36px; align-items: center;
    }
    .sky-head {
      font-family: var(--disp); color: var(--yellow); font-size: clamp(52px, 11vw, 132px);
      line-height:.92; text-shadow: 0 2px 0 rgba(20,30,60,.12); max-width: 12ch; cursor: default;
    }
    .sky-head .ch { display: inline-block; will-change: transform; }
    @media (prefers-reduced-motion: no-preference) {
      .sky-head:hover .ch { animation: slinky .6s ease both; animation-delay: calc(var(--i)*.045s); }
    }
    @keyframes slinky { 0%, 100% { transform: translateY(0); } 42% { transform: translateY(-.5em); } }
    .sky-media img { width: 100%; height: auto; border-radius: 18px; }
    .sky-note { margin-top: 12px; font-size: 11.5px; color: #2d5a86; opacity: .85; }
    @media(max-width: 760px) { .sky-in { grid-template-columns: 1fr; gap: 22px; } }

    /* showcases + reveals */
    .showcase { display: flex; justify-content: center; align-items: center; padding-block: clamp(48px, 8vw, 104px); }
    .showcase .draw { width: min(440px, 78vw); height: auto; filter: drop-shadow(0 20px 40px rgba(0,0,0,.14)); }
    .cream { background: var(--cream); }
    .ygreen { background: linear-gradient(180deg, var(--yg1), var(--yg2)); }
    .headvid { width: min(360px, 72vw); height: auto; mix-blend-mode: multiply; }
    @media (prefers-reduced-motion: no-preference) {
      .reveal.play .draw { animation: drawin 1.5s ease both; }
      .reveal.play .headvid { animation: popin 1.1s cubic-bezier(.2, 1.3, .4, 1) both; }
    }
    @keyframes drawin { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes popin { 0% { transform: scale(.82); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* featured case block */
    .mint { background: linear-gradient(140deg, var(--mint1), var(--mint2)); }
    .feat { padding-block: clamp(48px, 8vw, 96px); display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: stretch; }
    .feat-media { position: relative; border-radius: 20px; overflow: hidden; min-height: 340px; box-shadow: 0 18px 44px rgba(0,0,0,.18); }
    .feat-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .feat-media .who {
      position: absolute; top: 16px; left: 18px; z-index: 2; color: #fff; font-weight: 700; font-size: 12px;
      letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,0,0,.5);
    }
    .feat-media h2 {
      position: absolute; left: 18px; right: 18px; bottom: 18px; z-index: 2; font-family: var(--disp);
      color: var(--yellow); font-size: clamp(30px, 5vw, 52px); line-height: .9; text-shadow: 0 2px 10px rgba(0,0,0,.45);
    }
    .feat-card {
      background: #fff; border-radius: 20px; padding: clamp(22px, 3vw, 34px); display: flex; flex-direction: column;
      gap: 16px; box-shadow: 0 18px 44px rgba(0,0,0,.1);
    }
    .feat-card h3 { font-family: var(--disp); font-size: clamp(24px, 3.4vw, 34px); }
    .feat-card p { color: #3a382f; font-size: 15.5px; }
    .tiles { display: flex; gap: 14px; flex-wrap: wrap; margin-top: auto; }
    .tile { flex: 1 1 150px; min-width: 0; border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; }
    .tile .lbl {
      font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--muted);
      border: 1.5px solid var(--line); border-radius: 999px; display: inline-block; padding: 3px 10px; margin-bottom: 8px;
    }
    .tile .n { font-family: var(--disp); font-size: clamp(26px, 3.6vw, 38px); line-height: 1; font-variant-numeric: tabular-nums; }
    .tile .u { font-size: 12px; color: var(--muted); margin-top: 3px; }
    @media(max-width: 760px) { .feat { grid-template-columns: 1fr; } .feat-media { min-height: 280px; } }

    /* clients */
    .clients {
      background: radial-gradient(60% 50% at 30% 20%, rgba(255,255,255,.7), transparent 60%),
      linear-gradient(180deg, #eaf4fb, var(--sky2));
    }
    .clients-in { padding-block: clamp(40px, 7vw, 78px); text-align: center; }
    .clients .label { font-weight: 800; text-transform: uppercase; letter-spacing: .18em; font-size: 12px; color: #4c6a86; }
    .clients-row { display: flex; flex-wrap: wrap; gap: 12px 34px; justify-content: center; align-items: center; margin-top: 18px; }
    .clients-row span { font-family: var(--disp); font-size: clamp(20px, 3.4vw, 34px); color: #1d3a52; opacity: .9; }
    .clients .mom { margin-top: 18px; font-weight: 600; color: #355; }
    .clients .mom b { color: var(--sky1); }

    /* section header */
    .band { padding-block: clamp(52px, 8vw, 100px); }
    .band-head { max-width: 60ch; display: flex; flex-direction: column; gap: 12px; margin-bottom: 34px; }
    .band-head h2 { font-family: var(--disp); font-size: clamp(34px, 6vw, 64px); }
    .band-head p { color: var(--muted); }

    /* works films (black) */
    .films { background: var(--black); color: #f4f1e6; }
    .films .band-head h2 { color: #fff; }
    .films .band-head p { color: #b7b3a6; }
    .films-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 26px; }
    .films-top img { height: 70px; width: auto; }
    .films-top .url { font-weight: 700; font-size: 12px; letter-spacing: .1em; color: var(--yellow); text-transform: uppercase; }
    .film-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .film { display: flex; flex-direction: column; gap: 12px; }
    .film .thumb { border-radius: 14px; overflow: hidden; aspect-ratio: 3/4; background: #1a1a1a; }
    .film .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .film .cap { font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
    .film .cap small { display: block; color: #b7b3a6; font-weight: 600; letter-spacing: .04em; margin-top: 3px; }
    @media(max-width: 720px) { .film-grid { grid-template-columns: 1fr; } }
    .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 20px; }
    .cat { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 3/5; min-height: 260px; }
    .cat img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cat span {
      position: absolute; right: 14px; bottom: 16px; writing-mode: vertical-rl; transform: rotate(180deg);
      font-family: var(--disp); font-size: clamp(22px, 3vw, 34px); color: #f2e7c9; text-shadow: 0 1px 8px rgba(0,0,0,.5);
    }
    @media(max-width: 720px) { .cats { grid-template-columns: 1fr 1fr; } .cat:last-child { grid-column: span 2; aspect-ratio: 16/9; min-height: 180px; } }

    /* case studies */
    .cases { background: var(--cream); }
    .case {
      background: #fffdf6; border: 1px solid var(--line); border-radius: 22px; padding: clamp(22px, 3.3vw, 38px);
      margin-bottom: 24px; position: relative; overflow: hidden;
    }
    .case .blob { position: absolute; width: 74px; height: 74px; border-radius: 50%; opacity: .9; pointer-events: none; }
    .case .blob.b1 { left: -14px; top: 40px; background: radial-gradient(circle at 35% 30%, #fff, var(--sky1) 70%); }
    .case .blob.b2 { left: 14px; top: 150px; width: 54px; height: 54px; background: radial-gradient(circle at 35% 30%, #fff, var(--coral) 70%); }
    .case-head .who { font-size: 12.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .case-head h3 { font-family: var(--disp); font-size: clamp(28px, 4.6vw, 50px); margin-top: 6px; }
    .case-media { aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; margin: 22px 0; }
    .case-media img { width: 100%; height: 100%; object-fit: cover; }
    .case-over { max-width: 70ch; color: #3a382f; margin-bottom: 20px; }
    .nums { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
    .num { flex: 1 1 140px; min-width: 0; border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px; background: var(--cream); }
    .num .n { font-family: var(--disp); font-size: clamp(22px, 3.2vw, 30px); font-variant-numeric: tabular-nums; }
    .num .k { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 15px; }
    .tab {
      border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 8px 16px; font-weight: 700;
      font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
    .tpanel { max-width: 70ch; color: #2f2d25; }

    /* projects */
    .projects { background: #fff; }
    .proj-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
    .proj { background: var(--cream); border-radius: 18px; padding: 22px; grid-column: span 2; display: flex; flex-direction: column; gap: 9px; }
    .proj.lead { grid-column: span 3; background: var(--ink); color: #f5f1e6; }
    .proj .k { font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 11px; color: var(--sky1); }
    .proj.lead .k { color: var(--yellow); }
    .proj h4 { font-family: var(--disp); font-size: clamp(19px, 2.6vw, 25px); font-weight: 400; }
    .proj p { font-size: 14.5px; color: #4a473c; }
    .proj.lead p { color: #d9d4c6; }
    .proj .m { margin-top: auto; font-weight: 700; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .proj.lead .m { color: #b7b3a6; }
    @media(max-width: 880px) { .proj-grid { grid-template-columns: 1fr 1fr; } .proj, .proj.lead { grid-column: span 1; } }
    @media(max-width: 520px) { .proj-grid { grid-template-columns: 1fr; } }

    /* studio */
    .studio { background: var(--cream); }
    .studio-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; }
    .founder { border-top: 2px solid var(--ink); padding-top: 16px; margin-top: 18px; }
    .founder .role { font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--sky1); }
    .founder h4 { font-family: var(--disp); font-size: clamp(22px, 3vw, 30px); margin: 4px 0 8px; }
    .founder p { color: #3a382f; font-size: 15.5px; }
    .how { background: var(--ink); color: #f5f1e6; border-radius: 20px; padding: clamp(24px, 3.4vw, 36px); align-self: start; }
    .how h3 { font-family: var(--disp); color: var(--yellow); font-size: clamp(24px, 3.2vw, 32px); margin: 10px 0 12px; }
    .how p { color: #d9d4c6; font-size: 16px; }
    @media(max-width: 820px) { .studio-grid { grid-template-columns: 1fr; gap: 24px; } }

    /* contact */
    .contact { background: linear-gradient(170deg, var(--sky2), #eaf4fb); }
    .contact-in { padding-block: clamp(52px, 9vw, 104px); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .contact h2 { font-family: var(--disp); font-size: clamp(34px, 7vw, 74px); color: #1d3a52; max-width: 16ch; }
    .contact p { color: #355; max-width: 46ch; }
    .crow { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .pill { border: 2px solid var(--ink); border-radius: 999px; padding: 11px 18px; font-weight: 700; font-size: 15px; background: rgba(255,255,255,.5); }
    .copy { cursor: pointer; }
    .copy:hover { background: var(--yellow); }
    .copy .ok { display: none; color: #1d3a52; }
    .copy.copied .lbl { display: none; }
    .copy.copied .ok { display: inline; }

    footer { background: var(--ink); color: #cfcabb; padding-block: 30px; }
    .foot-in { display: flex; flex-wrap: wrap; gap: 12px 26px; justify-content: space-between; align-items: center; }
    .foot-in .b { font-family: var(--disp); color: #fff; font-size: 18px; }
    .foot-in a { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #cfcabb; }
    .foot-in a:hover { color: var(--yellow); }
    .foot-in .cr { width: 100%; font-size: 12px; color: #8f8b7e; }
    :focus-visible { outline: 3px solid var(--sky1); outline-offset: 2px; }
  </style>
</head>

    <div class="wrap nav-in">
      <nav class="nav-links">
        <a href="#studio">About</a>
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
      </nav>
      <a href="#top" class="nav-brand">Twofold</a>

  </header>
